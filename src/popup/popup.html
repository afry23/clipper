<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px system-ui, sans-serif; width: 260px; margin: 12px; }
      button { width: 100%; padding: 8px; font-size: 14px; }
      #cancel { margin-top: 6px; }
      #status { margin-top: 8px; min-height: 1.4em; white-space: pre-line; word-break: break-word; }
      #status.error { color: #b00020; }
      #settings { display: block; margin-top: 8px; font-size: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="main">
      <button id="clip" type="button">Seite clippen</button>
      <button id="cancel" type="button" hidden>Abbrechen</button>
      <a id="settings" href="#">Einstellungen</a>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
