<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Clipper – Einstellungen</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
      fieldset { margin: 0 0 16px; padding: 12px 16px; }
      label { display: block; margin: 8px 0; }
      label.check { display: flex; gap: 8px; align-items: center; }
      input[type="text"], input[type="number"], select { padding: 4px; font: inherit; }
      input[type="text"] { width: 100%; box-sizing: border-box; }
      small { display: block; color: #555; }
      #status { margin-left: 12px; color: #2e7d32; }
      #status.error { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>Clipper</h1>
    <form id="form">
      <fieldset>
        <legend>Speichern</legend>
        <label>Zielordner
          <input type="text" id="subfolder" />
          <small>Relativ zum Downloads-Ordner des Browsers.</small>
        </label>
        <label>Ordnername
          <input type="text" id="folderTemplate" />
          <small>Platzhalter: {date}, {title}, {site}</small>
        </label>
        <label>Format
          <select id="format">
            <option value="folder">Ordner (index.md + assets/)</option>
            <option value="zip">ZIP-Datei</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="downloadImages" /> Bilder herunterladen</label>
        <label class="check"><input type="checkbox" id="preview" /> Vorschau vor dem Speichern</label>
        <label class="check"><input type="checkbox" id="leadImage" /> Titelbild ergänzen (og:image), falls der Artikel keins enthält</label>
      </fieldset>
      <fieldset>
        <legend>Mehrseitige Artikel</legend>
        <label class="check"><input type="checkbox" id="paginate" /> Alle Seiten laden</label>
        <label class="check"><input type="checkbox" id="preferSinglePage" /> Ein-Seiten-/Druckansicht bevorzugen, falls vorhanden</label>
        <label>Maximale Seitenzahl <input type="number" id="maxPages" min="1" max="200" /></label>
      </fieldset>
      <button type="submit">Speichern</button><span id="status" role="status"></span>
    </form>
    <script src="options.js" type="module"></script>
  </body>
</html>
